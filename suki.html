<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNG Sequence → Video</title><style>body{font-family:system-ui;background:#10131a;color:#eee;max-width:900px;margin:auto;padding:30px}section{background:#181c25;padding:20px;border-radius:16px;margin:15px 0}button,select,input{padding:11px;border-radius:9px;border:1px solid #394150;background:#0e1117;color:#fff}button{background:#7c3aed;border:0;font-weight:700;cursor:pointer}.drop{padding:45px;text-align:center;border:2px dashed #4b5563;border-radius:14px;cursor:pointer}.drop.drag{background:#24183b;border-color:#8b5cf6}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row>*{min-width:0}video{width:100%;margin-top:15px;background:#000;border-radius:10px}.bar{height:8px;background:#7c3aed;width:0;border-radius:9px;margin-top:15px}.list{max-height:220px;overflow:auto;font-size:13px;color:#bbb;margin-top:12px}.item{padding:5px;border-bottom:1px solid #252a35}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><h1>🎬 PNG Sequence → Video</h1><p>Ubah render Blender menjadi MP4/WebM langsung di browser.</p><section><div id="drop" class="drop"><b>Pilih semua frame PNG/JPG</b><br><small>atau drag & drop di sini</small><input id="files" type="file" accept="image/png,image/jpeg" multiple hidden></div><div id="list" class="list"></div></section><section><div class="row"><label>FPS<br><select id="fps"><option>12</option><option selected>24</option><option>25</option><option>30</option><option>50</option><option>60</option><option value="custom">Custom</option></select></label><label id="customBox" style="display:none">Custom FPS<br><input id="custom" type="number" min="1" max="240" value="24"></label></div><br><label>Format<br><select id="format"><option value="mp4">MP4 (H.264)</option><option value="webm">WebM</option></select></label><br><br><button id="go" disabled>Buat Video</button><div id="bar" class="bar"></div><p id="status">Belum ada frame.</p></section><section id="result" hidden><h3>Preview</h3><video id="preview" controls></video><p><a id="download" download="blender_video.mp4">⬇ Download video</a></p></section><script type="module">
import {FFmpeg} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';import{fetchFile,toBlobURL}from'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';
const $=id=>document.getElementById(id),drop=$('drop'),picker=$('files'),list=$('list'),go=$('go'),bar=$('bar'),status=$('status');let files=[],ff=null,loaded=false;
drop.onclick=()=>picker.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');setFiles([...e.dataTransfer.files])};picker.onchange=e=>setFiles([...e.target.files]);
function setFiles(x){files=x.filter(f=>/image\/(png|jpeg)/.test(f.type));files.sort((a,b)=>natural(a.name).localeCompare(natural(b.name)));list.innerHTML=files.map((f,i)=>`<div class="item">${i+1}. ${f.name}</div>`).join('');go.disabled=!files.length;status.textContent=files.length?`${files.length} frame dipilih.`:'Belum ada frame.'}function natural(s){return s.toLowerCase().replace(/\d+/g,n=>n.padStart(20,'0'))}
$('fps').onchange=e=>$('customBox').style.display=e.target.value==='custom'?'block':'none';
async function load(){if(loaded)return;status.textContent='Menyiapkan engine video...';ff=new FFmpeg();ff.on('progress',p=>bar.style.width=Math.round(p.progress*100)+'%');let b='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';await ff.load({coreURL:await toBlobURL(b+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(b+'/ffmpeg-core.wasm','application/wasm')});loaded=true}
go.onclick=async()=>{go.disabled=true;try{await load();let fps=$('fps').value==='custom'?+$('custom').value:+$('fps').value;if(!fps||fps<1||fps>240)throw Error('FPS tidak valid');try{await ff.deleteDir('/in')}catch{}try{await ff.deleteDir('/out')}catch{}await ff.createDir('/in');await ff.createDir('/out');let ext=files.every(f=>f.type==='image/png')?'png':'jpg';for(let i=0;i<files.length;i++){await ff.writeFile(`/in/frame_${String(i).padStart(6,'0')}.${ext}`,await fetchFile(files[i]));if(i%10===0){status.textContent=`Memuat frame ${i+1}/${files.length}...`;bar.style.width=Math.round(i/files.length*30)+'%'}}let fmt=$('format').value,out=fmt==='mp4'?'/out/video.mp4':'/out/video.webm';status.textContent='Encoding video...';let args=['-framerate',String(fps),'-i',`/in/frame_%06d.${ext}`];if(fmt==='mp4')args.push('-c:v','libx264','-preset','veryfast','-crf','18','-pix_fmt','yuv420p','-movflags','+faststart',out);else args.push('-c:v','libvpx-vp9','-crf','30','-b:v','0',out);await ff.exec(args);let data=await ff.readFile(out),url=URL.createObjectURL(new Blob([data.buffer],{type:fmt==='mp4'?'video/mp4':'video/webm'}));$('preview').src=url;$('download').href=url;$('download').download=`blender_${fps}fps.${fmt}`;$('result').hidden=false;bar.style.width='100%';status.textContent=`Selesai — ${files.length} frame @ ${fps} fps.`}catch(e){console.error(e);status.textContent='Gagal: '+e.message;alert('Gagal membuat video. Jika dibuka sebagai file HTML dan browser memblokir module, jalankan lewat localhost.')}finally{go.disabled=false}};
</script></body></html>
