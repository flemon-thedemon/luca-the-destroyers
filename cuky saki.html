```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Tugas Saya</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    color: #64748b;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #64748b;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

.add-btn {
    background: #0f172a;
    color: white;
    white-space: nowrap;
}

.task-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid #e2e8f0;
}

.task:last-child {
    border-bottom: none;
}

.check {
    width: 20px;
    height: 20px;
    cursor: pointer;
    flex-shrink: 0;
}

.task-name {
    flex: 1;
    word-break: break-word;
}

.task.done .task-name {
    text-decoration: line-through;
    color: #94a3b8;
}

.actions {
    display: flex;
    gap: 5px;
}

.edit {
    background: #e2e8f0;
}

.delete {
    background: #fee2e2;
    color: #b91c1c;
}

.filters {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.filter {
    background: white;
    color: #475569;
}

.filter.active {
    background: #0f172a;
    color: white;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: white;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.stat-number {
    display: block;
    font-size: 22px;
    font-weight: bold;
}

.stat-label {
    font-size: 12px;
    color: #64748b;
}

.empty {
    text-align: center;
    color: #94a3b8;
    padding: 30px 10px;
}

.github-box {
    font-size: 13px;
    color: #64748b;
}

.github-status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #f8fafc;
}

.token-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.token-area input {
    flex: 1;
}

.token-btn {
    background: #0f172a;
    color: white;
    white-space: nowrap;
}

.clear-token {
    margin-top: 8px;
    background: #fee2e2;
    color: #b91c1c;
}

footer {
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    padding: 20px;
}

@media (max-width: 500px) {

    .container {
        padding: 12px;
    }

    .input-area {
        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .actions {
        flex-direction: column;
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 12px 5px;
    }

    .token-area {
        flex-direction: column;
    }

    .token-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📋 Daftar Tugas</h1>
    <p>Tugas pribadi saya</p>
</header>


<!-- GITHUB -->
<div class="card">

    <div class="github-box">

        <strong>☁️ Penyimpanan GitHub</strong>

        <div id="repoInfo"></div>

        <div class="github-status" id="status">
            🔴 Belum terhubung
        </div>

        <div class="token-area">

            <input
                type="password"
                id="token"
                placeholder="Masukkan GitHub Token"
            >

            <button
                class="token-btn"
                onclick="saveToken()"
            >
                Simpan
            </button>

        </div>

        <button
            class="clear-token"
            onclick="removeToken()"
        >
            Hapus Token dari Browser
        </button>

    </div>

</div>


<!-- TAMBAH TUGAS -->
<div class="card">

    <div class="input-area">

        <input
            type="text"
            id="taskInput"
            placeholder="Apa yang harus dikerjakan?"
            autocomplete="off"
        >

        <button
            class="add-btn"
            onclick="addTask()"
        >
            + Tambah
        </button>

    </div>

</div>


<!-- FILTER -->
<div class="filters">

    <button
        class="filter active"
        data-filter="all"
        onclick="changeFilter('all', this)"
    >
        Semua
    </button>

    <button
        class="filter"
        data-filter="todo"
        onclick="changeFilter('todo', this)"
    >
        Belum selesai
    </button>

    <button
        class="filter"
        data-filter="done"
        onclick="changeFilter('done', this)"
    >
        Selesai
    </button>

</div>


<!-- STATISTIK -->
<div class="stats">

    <div class="stat">
        <span
            class="stat-number"
            id="total"
        >0</span>

        <span class="stat-label">
            Total
        </span>
    </div>

    <div class="stat">
        <span
            class="stat-number"
            id="pending"
        >0</span>

        <span class="stat-label">
            Belum selesai
        </span>
    </div>

    <div class="stat">
        <span
            class="stat-number"
            id="completed"
        >0</span>

        <span class="stat-label">
            Selesai
        </span>
    </div>

</div>


<!-- DAFTAR -->
<div class="card">

    <ul
        class="task-list"
        id="taskList"
    ></ul>

    <div
        class="empty"
        id="empty"
    >
        Belum ada tugas 🎉
    </div>

</div>


<footer>
    Daftar Tugas Pribadi • GitHub
</footer>

</div>


<script>

const API = "https://api.github.com";

let tasks = [];

let filter = "all";

let token =
    localStorage.getItem("github_token") || "";


// ======================================================
// MENENTUKAN USERNAME & REPOSITORY OTOMATIS
// ======================================================

function getGithubInfo() {

    const hostname =
        window.location.hostname;

    const pathname =
        window.location.pathname;


    /*
        Contoh:

        https://budi.github.io/tugas/

        hostname:
        budi.github.io

        pathname:
        /tugas/

        username:
        budi

        repository:
        tugas
    */


    if (
        !hostname.endsWith(".github.io")
    ) {

        return null;

    }


    const username =
        hostname.split(".")[0];


    const parts =
        pathname
            .split("/")
            .filter(Boolean);


    if (parts.length === 0) {

        return null;

    }


    const repository =
        parts[0];


    return {
        username,
        repository
    };

}


const github =
    getGithubInfo();


if (github) {

    document.getElementById(
        "repoInfo"
    ).innerHTML =
        `
        Repository:
        <strong>
            ${github.username}/${github.repository}
        </strong>
        `;

} else {

    document.getElementById(
        "repoInfo"
    ).innerHTML =
        `
        ⚠️ Website harus dijalankan
        melalui GitHub Pages.
        `;

}


// ======================================================
// HEADER GITHUB
// ======================================================

function headers() {

    return {

        "Accept":
            "application/vnd.github+json",

        "Authorization":
            `Bearer ${token}`,

        "X-GitHub-Api-Version":
            "2022-11-28"

    };

}


// ======================================================
// SIMPAN TOKEN
// ======================================================

function saveToken() {

    const input =
        document.getElementById("token");

    const value =
        input.value.trim();


    if (!value) {

        alert("Masukkan GitHub Token.");

        return;

    }


    token = value;


    localStorage.setItem(
        "github_token",
        token
    );


    input.value = "";


    setStatus(
        "🟢 Token tersimpan di browser"
    );


    loadTasks();

}


// ======================================================
// HAPUS TOKEN
// ======================================================

function removeToken() {

    localStorage.removeItem(
        "github_token"
    );

    token = "";


    setStatus(
        "🔴 Token telah dihapus"
    );

}


document.getElementById(
    "token"
).addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            saveToken();

        }

    }
);


// ======================================================
// STATUS
// ======================================================

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent =
        message;

}


// ======================================================
// LOAD DATA
// ======================================================

async function loadTasks() {

    if (!github) {

        return;

    }


    if (!token) {

        setStatus(
            "🔴 Masukkan GitHub Token terlebih dahulu"
        );

        render();

        return;

    }


    setStatus(
        "⏳ Mengambil tugas dari GitHub..."
    );


    try {

        const url =
            `${API}/repos/` +
            `${github.username}/` +
            `${github.repository}/` +
            `contents/tasks.json`;


        const response =
            await fetch(
                url,
                {
                    headers: headers()
                }
            );


        // File belum ada
        if (response.status === 404) {

            tasks = [];

            render();

            setStatus(
                "🟢 Terhubung ke GitHub"
            );

            return;

        }


        if (!response.ok) {

            const error =
                await response.json();

            throw new Error(
                error.message ||
                "Gagal membaca GitHub."
            );

        }


        const data =
            await response.json();


        const content =
            decodeBase64(
                data.content
            );


        tasks =
            JSON.parse(content);


        render();


        setStatus(
            "🟢 Tugas berhasil dimuat"
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "🔴 Gagal mengambil data"
        );

        alert(
            "Gagal mengambil tugas:\n\n" +
            error.message
        );

    }

}


// ======================================================
// SIMPAN DATA
// ======================================================

async function saveTasks() {

    if (!github) {

        alert(
            "Website belum dijalankan melalui GitHub Pages."
        );

        return;

    }


    if (!token) {

        alert(
            "Masukkan GitHub Token terlebih dahulu."
        );

        return;

    }


    setStatus(
        "⏳ Menyimpan ke GitHub..."
    );


    try {

        const url =
            `${API}/repos/` +
            `${github.username}/` +
            `${github.repository}/` +
            `contents/tasks.json`;


        // Ambil SHA file lama
        const oldFile =
            await fetch(
                url,
                {
                    headers: headers()
                }
            );


        let sha = null;


        if (oldFile.ok) {

            const data =
                await oldFile.json();

            sha =
                data.sha;

        }


        const json =
            JSON.stringify(
                tasks,
                null,
                2
            );


        const encoded =
            encodeBase64(json);


        const body = {

            message:
                "Update daftar tugas",

            content:
                encoded

        };


        if (sha) {

            body.sha =
                sha;

        }


        const response =
            await fetch(
                url,
                {

                    method: "PUT",

                    headers: {

                        ...headers(),

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(body)

                }
            );


        if (!response.ok) {

            const error =
                await response.json();

            throw new Error(
                error.message ||
                "Gagal menyimpan."
            );

        }


        setStatus(
            "🟢 Tersimpan di GitHub"
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "🔴 Gagal menyimpan"
        );

        alert(
            "Gagal menyimpan ke GitHub:\n\n" +
            error.message
        );

    }

}


// ======================================================
// TAMBAH TUGAS
// ======================================================

async function addTask() {

    const input =
        document.getElementById(
            "taskInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    tasks.push({

        id:
            Date.now(),

        text:
            text,

        completed:
            false,

        createdAt:
            new Date().toISOString()

    });


    input.value = "";


    render();


    await saveTasks();

}


document.getElementById(
    "taskInput"
).addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            addTask();

        }

    }
);


// ======================================================
// CHECKLIST
// ======================================================

async function toggleTask(id) {

    const task =
        tasks.find(
            task => task.id === id
        );


    if (!task) {

        return;

    }


    task.completed =
        !task.completed;


    render();


    await saveTasks();

}


// ======================================================
// EDIT
// ======================================================

async function editTask(id) {

    const task =
        tasks.find(
            task => task.id === id
        );


    if (!task) {

        return;

    }


    const newText =
        prompt(
            "Edit tugas:",
            task.text
        );


    if (newText === null) {

        return;

    }


    const text =
        newText.trim();


    if (!text) {

        return;

    }


    task.text =
        text;


    render();


    await saveTasks();

}


// ======================================================
// HAPUS
// ======================================================

async function deleteTask(id) {

    const yakin =
        confirm(
            "Hapus tugas ini?"
        );


    if (!yakin) {

        return;

    }


    tasks =
        tasks.filter(
            task => task.id !== id
        );


    render();


    await saveTasks();

}


// ======================================================
// FILTER
// ======================================================

function changeFilter(
    newFilter,
    button
) {

    filter =
        newFilter;


    document
        .querySelectorAll(".filter")
        .forEach(
            btn =>
                btn.classList
                    .remove("active")
        );


    button.classList.add(
        "active"
    );


    render();

}


// ======================================================
// RENDER
// ======================================================

function render() {

    const list =
        document.getElementById(
            "taskList"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    list.innerHTML = "";


    let visibleTasks =
        tasks;


    if (filter === "todo") {

        visibleTasks =
            tasks.filter(
                task =>
                    !task.completed
            );

    }


    if (filter === "done") {

        visibleTasks =
            tasks.filter(
                task =>
                    task.completed
            );

    }


    empty.style.display =
        visibleTasks.length === 0
            ? "block"
            : "none";


    visibleTasks.forEach(
        task => {

            const li =
                document.createElement(
                    "li"
                );


            li.className =
                "task" +
                (
                    task.completed
                        ? " done"
                        : ""
                );


            // Checkbox
            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "check";

            checkbox.checked =
                task.completed;


            checkbox.onchange =
                () =>
                    toggleTask(
                        task.id
                    );


            // Nama tugas
            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "task-name";

            name.textContent =
                task.text;


            // Tombol
            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "actions";


            const edit =
                document.createElement(
                    "button"
                );

            edit.className =
                "edit";

            edit.textContent =
                "✏️";

            edit.onclick =
                () =>
                    editTask(
                        task.id
                    );


            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "delete";

            del.textContent =
                "🗑️";

            del.onclick =
                () =>
                    deleteTask(
                        task.id
                    );


            actions.appendChild(
                edit
            );

            actions.appendChild(
                del
            );


            li.appendChild(
                checkbox
            );

            li.appendChild(
                name
            );

            li.appendChild(
                actions
            );


            list.appendChild(
                li
            );

        }
    );


    updateStats();

}


// ======================================================
// STATISTIK
// ======================================================

function updateStats() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task =>
                task.completed
        ).length;


    const pending =
        total - completed;


    document.getElementById(
        "total"
    ).textContent =
        total;


    document.getElementById(
        "pending"
    ).textContent =
        pending;


    document.getElementById(
        "completed"
    ).textContent =
        completed;

}


// ======================================================
// BASE64
// ======================================================

function encodeBase64(text) {

    const bytes =
        new TextEncoder()
            .encode(text);


    let binary = "";


    bytes.forEach(
        byte => {

            binary +=
                String.fromCharCode(
                    byte
                );

        }
    );


    return btoa(binary);

}


function decodeBase64(base64) {

    const binary =
        atob(
            base64.replace(
                /\n/g,
                ""
            )
        );


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    return new TextDecoder()
        .decode(bytes);

}


// ======================================================
// START
// ======================================================

render();

if (token) {

    loadTasks();

}

</script>

</body>
</html>
